<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 535" role="img" aria-label="研究框架导图"><title>研究框架导图</title><path d="M450,265 C380.0,265 380.0,90 310,90" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M450,265 C380.0,265 380.0,270 310,270" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M450,265 C380.0,265 380.0,450 310,450" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,90 790,90" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,270 790,270" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,450 790,450" fill="none" stroke="#b4c9c4" stroke-width="2"/><rect x="420" y="207" width="260" height="116" rx="22" fill="#123e45"/><text x="550" y="250" text-anchor="middle" fill="#ffffff" style="fill:#ffffff;font-size:22px;font-weight:700">一次确认</text><text x="550" y="278" text-anchor="middle" fill="#ffffff" style="fill:#ffffff;font-size:22px;font-weight:700">明确一个对象</text><g><rect x="20" y="25" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="53" fill="#44717a" style="font-size:12px">Fact</text><text x="38" y="83" fill="#123e45" style="font-size:20px;font-weight:700">原数核验</text><text x="38" y="112" fill="#46636a" style="font-size:14px">原页、值、单位、主体</text><text x="38" y="133" fill="#46636a" style="font-size:14px">真实答复绑定来源</text></g><g><rect x="20" y="205" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="233" fill="#44717a" style="font-size:12px">可比性裁决</text><text x="38" y="263" fill="#123e45" style="font-size:20px;font-weight:700">用途与口径</text><text x="38" y="292" fill="#46636a" style="font-size:14px">这个数用来回答什么</text><text x="38" y="313" fill="#46636a" style="font-size:14px">断点不能靠近似越过</text></g><g><rect x="20" y="385" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="413" fill="#44717a" style="font-size:12px">Interpretation</text><text x="38" y="443" fill="#123e45" style="font-size:20px;font-weight:700">研究意见</text><text x="38" y="472" fill="#46636a" style="font-size:14px">优先解释与替代解释</text><text x="38" y="493" fill="#46636a" style="font-size:14px">可区分观测与反证</text></g><g><rect x="790" y="25" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="53" fill="#44717a" style="font-size:12px">Forecast</text><text x="808" y="83" fill="#123e45" style="font-size:20px;font-weight:700">模型参数</text><text x="808" y="112" fill="#46636a" style="font-size:14px">历史尺度与人为设定</text><text x="808" y="133" fill="#46636a" style="font-size:14px">期限、敏感度和失效</text></g><g><rect x="790" y="205" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="233" fill="#44717a" style="font-size:12px">内容采纳</text><text x="808" y="263" fill="#123e45" style="font-size:20px;font-weight:700">版本验收</text><text x="808" y="292" fill="#46636a" style="font-size:14px">绑定实际受审内容</text><text x="808" y="313" fill="#46636a" style="font-size:14px">不继承旧版认可</text></g><g><rect x="790" y="385" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="413" fill="#44717a" style="font-size:12px">独立记录</text><text x="808" y="443" fill="#123e45" style="font-size:20px;font-weight:700">真实签署</text><text x="808" y="472" fill="#46636a" style="font-size:14px">执行、复核与日期</text><text x="808" y="493" fill="#46636a" style="font-size:14px">按实际授权如实记录</text></g></svg>