<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 535" role="img" aria-label="研究框架导图"><title>研究框架导图</title><path d="M450,265 C380.0,265 380.0,90 310,90" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M450,265 C380.0,265 380.0,270 310,270" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M450,265 C380.0,265 380.0,450 310,450" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,90 790,90" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,270 790,270" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,450 790,450" fill="none" stroke="#b4c9c4" stroke-width="2"/><rect x="420" y="207" width="260" height="116" rx="22" fill="#123e45"/><text x="550" y="250" text-anchor="middle" fill="#ffffff" style="fill:#ffffff;font-size:22px;font-weight:700">可复用的研究</text><text x="550" y="278" text-anchor="middle" fill="#ffffff" style="fill:#ffffff;font-size:22px;font-weight:700">问题推动证据</text><g><rect x="20" y="25" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="53" fill="#44717a" style="font-size:12px">01 定题</text><text x="38" y="83" fill="#123e45" style="font-size:20px;font-weight:700">01 定题：先写对象、问</text><text x="38" y="112" fill="#46636a" style="font-size:14px">先写对象、问题与时点</text><text x="38" y="133" fill="#46636a" style="font-size:14px">一页研究简报和材料范围，不从“公司</text></g><g><rect x="20" y="205" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="233" fill="#44717a" style="font-size:12px">02 证据</text><text x="38" y="263" fill="#123e45" style="font-size:20px;font-weight:700">02 证据：先确认这是什</text><text x="38" y="292" fill="#46636a" style="font-size:14px">先确认这是什么数字</text><text x="38" y="313" fill="#46636a" style="font-size:14px">当前有效事实、候选与缺口分开；旧事</text></g><g><rect x="20" y="385" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="413" fill="#44717a" style="font-size:12px">03 分解</text><text x="38" y="443" fill="#123e45" style="font-size:20px;font-weight:700">03 分解：找没有同步变</text><text x="38" y="472" fill="#46636a" style="font-size:14px">找没有同步变化的变量</text><text x="38" y="493" fill="#46636a" style="font-size:14px">同范围勾稽、贡献桥、年度路径，算术</text></g><g><rect x="790" y="25" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="53" fill="#44717a" style="font-size:12px">04 解释</text><text x="808" y="83" fill="#123e45" style="font-size:20px;font-weight:700">04 解释：提出优先机制</text><text x="808" y="112" fill="#46636a" style="font-size:14px">提出优先机制和竞争解释</text><text x="808" y="133" fill="#46636a" style="font-size:14px">判断—关键数字—机制—替代—反证—</text></g><g><rect x="790" y="205" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="233" fill="#44717a" style="font-size:12px">05 预测</text><text x="808" y="263" fill="#123e45" style="font-size:20px;font-weight:700">05 预测：把故事变成参</text><text x="808" y="292" fill="#46636a" style="font-size:14px">把故事变成参数条件</text><text x="808" y="313" fill="#46636a" style="font-size:14px">压力/基准/修复、关键门槛、改判条</text></g><g><rect x="790" y="385" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="413" fill="#44717a" style="font-size:12px">06 复盘</text><text x="808" y="443" fill="#123e45" style="font-size:20px;font-weight:700">06 复盘：先解释误差，</text><text x="808" y="472" fill="#46636a" style="font-size:14px">先解释误差，再改模型</text><text x="808" y="493" fill="#46636a" style="font-size:14px">更新机制与参数；保留旧模型、真实修</text></g></svg>