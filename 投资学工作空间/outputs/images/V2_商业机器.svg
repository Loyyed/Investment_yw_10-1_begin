<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 535" role="img" aria-label="研究框架导图"><title>研究框架导图</title><path d="M450,265 C380.0,265 380.0,90 310,90" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M450,265 C380.0,265 380.0,270 310,270" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M450,265 C380.0,265 380.0,450 310,450" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,90 790,90" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,270 790,270" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,450 790,450" fill="none" stroke="#b4c9c4" stroke-width="2"/><rect x="420" y="207" width="260" height="116" rx="22" fill="#123e45"/><text x="550" y="250" text-anchor="middle" fill="#ffffff" style="fill:#ffffff;font-size:22px;font-weight:700">产品与时间</text><text x="550" y="278" text-anchor="middle" fill="#ffffff" style="fill:#ffffff;font-size:22px;font-weight:700">怎样变成收益</text><g><rect x="20" y="25" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="53" fill="#44717a" style="font-size:12px">供给时钟</text><text x="38" y="83" fill="#123e45" style="font-size:20px;font-weight:700">投入与等待</text><text x="38" y="112" fill="#46636a" style="font-size:14px">原料、生产与贮存</text><text x="38" y="133" fill="#46636a" style="font-size:14px">匹配可售安排</text></g><g><rect x="20" y="205" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="233" fill="#44717a" style="font-size:12px">需求时钟</text><text x="38" y="263" fill="#123e45" style="font-size:20px;font-weight:700">客户接受</text><text x="38" y="292" fill="#46636a" style="font-size:14px">数量与组合实现价</text><text x="38" y="313" fill="#46636a" style="font-size:14px">出货与终端分开</text></g><g><rect x="20" y="385" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="413" fill="#44717a" style="font-size:12px">责任归属</text><text x="38" y="443" fill="#123e45" style="font-size:20px;font-weight:700">渠道交付</text><text x="38" y="472" fill="#46636a" style="font-size:14px">触达、服务与确认</text><text x="38" y="493" fill="#46636a" style="font-size:14px">平台包含在直销内</text></g><g><rect x="790" y="25" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="53" fill="#44717a" style="font-size:12px">机制假说</text><text x="808" y="83" fill="#123e45" style="font-size:20px;font-weight:700">品牌与替代</text><text x="808" y="112" fill="#46636a" style="font-size:14px">识别、信任与支付</text><text x="808" y="133" fill="#46636a" style="font-size:14px">需要独立区分证据</text></g><g><rect x="790" y="205" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="233" fill="#44717a" style="font-size:12px">资金时钟</text><text x="808" y="263" fill="#123e45" style="font-size:20px;font-weight:700">费用与回款</text><text x="808" y="292" fill="#46636a" style="font-size:14px">税费、周转与金融范围</text><text x="808" y="313" fill="#46636a" style="font-size:14px">毛利继续走向现金</text></g><g><rect x="790" y="385" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="413" fill="#44717a" style="font-size:12px">资本配置</text><text x="808" y="443" fill="#123e45" style="font-size:20px;font-weight:700">下一轮投入</text><text x="808" y="472" fill="#46636a" style="font-size:14px">库存、能力与时间</text><text x="808" y="493" fill="#46636a" style="font-size:14px">维持与扩张待细分</text></g></svg>