<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 535" role="img" aria-label="研究框架导图"><title>研究框架导图</title><path d="M450,265 C380.0,265 380.0,90 310,90" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M450,265 C380.0,265 380.0,270 310,270" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M450,265 C380.0,265 380.0,450 310,450" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,90 790,90" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,270 790,270" fill="none" stroke="#b4c9c4" stroke-width="2"/><path d="M650,265 C720.0,265 720.0,450 790,450" fill="none" stroke="#b4c9c4" stroke-width="2"/><rect x="420" y="207" width="260" height="116" rx="22" fill="#123e45"/><text x="550" y="250" text-anchor="middle" fill="#ffffff" style="fill:#ffffff;font-size:22px;font-weight:700">任务合同</text><text x="550" y="278" text-anchor="middle" fill="#ffffff" style="fill:#ffffff;font-size:22px;font-weight:700">连成研究路线</text><g><rect x="20" y="25" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="53" fill="#44717a" style="font-size:12px">第一、二次</text><text x="38" y="83" fill="#123e45" style="font-size:20px;font-weight:700">定位与结构</text><text x="38" y="112" fill="#46636a" style="font-size:14px">从原页找数字</text><text x="38" y="133" fill="#46636a" style="font-size:14px">按产品、地区、渠道整理</text></g><g><rect x="20" y="205" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="233" fill="#44717a" style="font-size:12px">第三、四次</text><text x="38" y="263" fill="#123e45" style="font-size:20px;font-weight:700">口径与变化</text><text x="38" y="292" fill="#46636a" style="font-size:14px">先辨主体与分母</text><text x="38" y="313" fill="#46636a" style="font-size:14px">再算同口径变化</text></g><g><rect x="20" y="385" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="38" y="413" fill="#44717a" style="font-size:12px">第五次</text><text x="38" y="443" fill="#123e45" style="font-size:20px;font-weight:700">商业模式</text><text x="38" y="472" fill="#46636a" style="font-size:14px">收入、成本、资本、现金</text><text x="38" y="493" fill="#46636a" style="font-size:14px">创造、交付与获取</text></g><g><rect x="790" y="25" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="53" fill="#44717a" style="font-size:12px">第五次延伸</text><text x="808" y="83" fill="#123e45" style="font-size:20px;font-weight:700">三条深入验证</text><text x="808" y="112" fill="#46636a" style="font-size:14px">生产与时间、渠道责任</text><text x="808" y="133" fill="#46636a" style="font-size:14px">现金与成熟资本</text></g><g><rect x="790" y="205" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="233" fill="#44717a" style="font-size:12px">第六次</text><text x="808" y="263" fill="#123e45" style="font-size:20px;font-weight:700">行业与品牌</text><text x="808" y="292" fill="#46636a" style="font-size:14px">定义市场与竞争问题</text><text x="808" y="313" fill="#46636a" style="font-size:14px">比较机制和替代解释</text></g><g><rect x="790" y="385" width="290" height="130" rx="15" fill="#e9f1ee" stroke="#c2d4ce"/><text x="808" y="413" fill="#44717a" style="font-size:12px">第七次＋研究扩展</text><text x="808" y="443" fill="#123e45" style="font-size:20px;font-weight:700">叙事与未来</text><text x="808" y="472" fill="#46636a" style="font-size:14px">原话与经济效果分开</text><text x="808" y="493" fill="#46636a" style="font-size:14px">条件预测、反证与复盘</text></g></svg>