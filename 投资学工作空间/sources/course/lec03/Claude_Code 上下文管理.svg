<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title {
        font: 700 34px -apple-system, BlinkMacSystemFont, "Helvetica Neue",
              "PingFang SC", "Microsoft YaHei", sans-serif;
        fill:#111827;
      }
      .en-main {
        font: 700 24px -apple-system, BlinkMacSystemFont, "Helvetica Neue",
              Arial, sans-serif;
        fill:#111827;
      }
      .zh-main {
        font: 600 19px -apple-system, BlinkMacSystemFont, "PingFang SC",
              "Microsoft YaHei", sans-serif;
        fill:#374151;
      }
      .en-sub {
        font: 600 19px -apple-system, BlinkMacSystemFont, "Helvetica Neue",
              Arial, sans-serif;
        fill:#374151;
      }
      .zh-sub {
        font: 400 17px -apple-system, BlinkMacSystemFont, "PingFang SC",
              "Microsoft YaHei", sans-serif;
        fill:#4B5563;
      }
      .note {
        font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC",
              "Microsoft YaHei", sans-serif;
        fill:#6B7280;
      }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#FFFFFF"/>

  <!-- Root -->
  <rect x="520" y="70" width="360" height="110" rx="22"
        fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="700" y="124" text-anchor="middle" class="title">Claude Code Context</text>
  <text x="700" y="153" text-anchor="middle" class="zh-main">Claude 上下文</text>

  <!-- Root to split -->
  <line x1="700" y1="180" x2="700" y2="225"
        stroke="#9CA3AF" stroke-width="2.4"/>
  <line x1="360" y1="225" x2="1040" y2="225"
        stroke="#9CA3AF" stroke-width="2.4"/>
  <line x1="360" y1="225" x2="360" y2="270"
        stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="1040" y1="225" x2="1040" y2="270"
        stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- Session Context -->
  <rect x="145" y="285" width="430" height="180" rx="22"
        fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="360" y="340" text-anchor="middle" class="en-main">Session Context</text>
  <text x="360" y="374" text-anchor="middle" class="zh-main">当前会话上下文</text>
  <line x1="210" y1="396" x2="510" y2="396"
        stroke="#FED7AA" stroke-width="2"/>
  <text x="360" y="430" text-anchor="middle" class="zh-sub">对话 / 工具结果</text>

  <!-- Injected Context -->
  <rect x="825" y="285" width="430" height="180" rx="22"
        fill="#EEF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="1040" y="340" text-anchor="middle" class="en-main">Injected Context</text>
  <text x="1040" y="374" text-anchor="middle" class="zh-main">注入的外部上下文</text>
  <line x1="890" y1="396" x2="1190" y2="396"
        stroke="#BFDBFE" stroke-width="2"/>
  <text x="1040" y="430" text-anchor="middle" class="zh-sub">项目规则 / 按需能力</text>

  <!-- Injected split -->
  <line x1="1040" y1="465" x2="1040" y2="520"
        stroke="#9CA3AF" stroke-width="2.4"/>
  <line x1="870" y1="520" x2="1210" y2="520"
        stroke="#9CA3AF" stroke-width="2.4"/>
  <line x1="870" y1="520" x2="870" y2="565"
        stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="1210" y1="520" x2="1210" y2="565"
        stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- CLAUDE.md -->
  <rect x="705" y="580" width="330" height="190" rx="22"
        fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="870" y="632" text-anchor="middle" class="en-main">CLAUDE.md</text>
  <text x="870" y="666" text-anchor="middle" class="en-sub">Persistent Context</text>
  <text x="870" y="700" text-anchor="middle" class="zh-main">持久上下文</text>
  <text x="870" y="735" text-anchor="middle" class="zh-sub">每次会话持续加载</text>

  <!-- Skill -->
  <rect x="1045" y="580" width="330" height="190" rx="22"
        fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
  <text x="1210" y="632" text-anchor="middle" class="en-main">Skill</text>
  <text x="1210" y="666" text-anchor="middle" class="en-sub">On-demand Context</text>
  <text x="1210" y="700" text-anchor="middle" class="zh-main">按需加载上下文</text>
  <text x="1210" y="735" text-anchor="middle" class="zh-sub">语义触发，需要时加载</text>

  <!-- Bottom note -->
  <rect x="185" y="815" width="1030" height="56" rx="16"
        fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="700" y="849" text-anchor="middle" class="note">
    Claude Code Context = 当前会话产生的即时上下文 + 系统注入的持久 / 按需上下文
  </text>
</svg>